query GetDomains(
  $environmentId: String!
  $projectId: String!
  $serviceId: String!
) {
  domains(
    environmentId: $environmentId
    projectId: $projectId
    serviceId: $serviceId
  ) {
    serviceDomains {
      id
      domain
      suffix
      targetPort
    }
    customDomains {
      id
      domain
      targetPort
    }
  }
}
